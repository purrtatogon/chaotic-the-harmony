services:

# --------------------
# PostgreSQL Database
# --------------------
  db:
    image: postgres:16-alpine
    container_name: cth_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cthdb123herewego}
      POSTGRES_DB: ${POSTGRES_DB:-cthdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
