# Active when `docker` is in SPRING_PROFILES_ACTIVE (Compose uses demo,docker so this layer overrides demo for DB/JPA/reset default).
spring.config.activate.on-profile=docker

# Full truncate + reseed at 00:00, 08:00, 16:00 UTC. Set DEMO_SCHEDULED_RESET_ENABLED=false to skip (e.g. long local sessions).
demo.scheduled-reset.enabled=${DEMO_SCHEDULED_RESET_ENABLED:false}


# For local Docker Compose.
server.port=${PORT:8080}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# CORS — defaults cover both dev and Docker-Compose; override via CORS_ALLOWED_ORIGINS env var
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT — no default in git; set via environment (Railway variables or root `.env` for Docker Compose).
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}