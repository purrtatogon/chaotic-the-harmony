# This profile is activated when running inside the Docker container!
spring.config.activate.on-profile=docker

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/cthdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cthdb123herewego}

# CORS — defaults cover both dev and Docker-Compose; override via CORS_ALLOWED_ORIGINS env var
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Security Settings
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}