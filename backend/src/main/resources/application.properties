# Root config: activates `demo` with `local` and `docker` (Seeder runs there).
#
# Actual settings live in profile documents:
#   • local → application-local.properties (gitignored — copy from *.example)
#   • docker → application-docker.properties (Compose: SPRING_PROFILES_ACTIVE=docker)
#   • prod → application-prod.properties (Azure / managed DB + secrets env vars)
spring.profiles.group.local=demo
spring.profiles.group.docker=demo
