# Server Port (PaaS sets PORT, default to 8080 for local)
server.port=${PORT:8080}

# JPA / Hibernate Settings
# Default create for greenfield deploys; Compose/local often override with SPRING_JPA_HIBERNATE_DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.generate-ddl=true

# JDBC batching (used heavily by DatabaseSeederService saveAll paths)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Database Connection
# Using standard names that both Docker and Railway can provide
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# App Features
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}