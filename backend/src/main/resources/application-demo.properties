# Active for Railway (`SPRING_PROFILES_ACTIVE=demo`) and as part of Compose (`demo,docker`).
spring.config.activate.on-profile=demo

# Full truncate + reseed at 00:00, 08:00, 16:00 UTC. Set DEMO_SCHEDULED_RESET_ENABLED=false to skip (e.g. long local sessions).
demo.scheduled-reset.enabled=${DEMO_SCHEDULED_RESET_ENABLED:true}


# PaaS (Railway, Render, etc.) sets PORT; keep 8080 for local Docker Compose.
server.port=${PORT:8080}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true

# Railway: use a JDBC URL (jdbc:postgresql://host:port/db). If the platform exposes only postgresql://,
# set DATABASE_URL in the dashboard to an equivalent jdbc:postgresql:// value.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# CORS — defaults cover both dev and Docker-Compose; override via CORS_ALLOWED_ORIGINS env var
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT — no default in git; set via environment (Railway variables or root `.env` for Docker Compose).
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}